# Personal countdowns. Keep dates QUOTED as strings.
# Prefix holiday names: 🇺🇸 US / 🇨🇳 CN / ∅ personal.
#
# ⚠️ 规矩（Frank 2026-07-20 拍板）：只放**当年**的节日，过一个少一个，不提前放来年的——
# 两个例外：春节（中国传统的年关）和 New Year 元旦（跨年，本年度的终点），隔年也保留。
# 每年年初把新一年的节日续进来。
# 农历节日公历日期逐年不同，续期时查万年历再填（别推算）：中秋2026=9/25、春节2027=2/6 已核实。

